name: Tests

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.*'
  pull_request:
    branches:
      - master
      - develop
      - 'v[0-9]+.*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, ubuntu-latest, macos-15-intel, macos-latest, windows-11-arm, windows-latest ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - name: Default feature tests on ${{matrix.os}}
        run: cargo test --locked --no-fail-fast
      - name: No default feature tests on ${{matrix.os}}
        run: cargo test --locked --no-default-features --no-fail-fast
      - name: Tests with `alloc` only on ${{matrix.os}}
        run: cargo test --locked --no-default-features --features alloc --no-fail-fast
      - name: Tests with `serde` only on ${{matrix.os}}
        run: cargo test --locked --no-default-features --features serde --no-fail-fast
      - name: All feature tests on ${{matrix.os}}
        run: cargo test --locked --all-features --no-fail-fast
  wasm-testing:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@9152e710e9f7182e4c29ad218e4f335a7b203613 # v1.1.3
      # NB: the tests expecting a panic are skipped there, since WebAssembly aborts on a panic.
      - name: Test on 32-bit WebAssembly
        run: cargo test --locked --target wasm32-wasip1 --all-features --no-fail-fast
      - name: Test on 32-bit WebAssembly without features
        run: cargo test --locked --target wasm32-wasip1 --no-default-features --no-fail-fast
