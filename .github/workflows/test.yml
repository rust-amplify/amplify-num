name: Tests

on:
  push:
    branches:
      - master
    tags:
      - 'v[0-9]+.*'
  pull_request:
    branches:
      - master
      - develop
      - 'v[0-9]+.*'

env:
  CARGO_TERM_COLOR: always

jobs:
  testing:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-24.04, ubuntu-24.04-arm, ubuntu-latest, macos-15-intel, macos-latest, windows-11-arm, windows-latest ]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test ${{matrix.os}}
        run: cargo test --all-features --no-fail-fast
      - name: Test ${{matrix.os}} without features
        run: cargo test --no-default-features --no-fail-fast
  wasm-testing:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      # NB: the tests expecting a panic are skipped there, since WebAssembly aborts on a panic
      - name: Test on 32-bit WebAssembly
        run: cargo test --target wasm32-wasip1 --all-features --no-fail-fast
      - name: Test on 32-bit WebAssembly without features
        run: cargo test --target wasm32-wasip1 --no-default-features --no-fail-fast
