name: Audit

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - develop
      - 'v[0-9]+.*'
  schedule:
    # Every Monday: new advisories appear without any change in the repository.
    - cron: '17 5 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      # Advisories, licenses, duplicate versions, and sources, as set in `deny.toml`.
      - name: Check the dependencies
        run: cargo deny --locked check
  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
          components: miri, rust-src
      # The crate forbids `unsafe` code; this checks dependency code executed by
      # the tests for undefined behavior.
      - name: Run the tests under Miri
        run: cargo +nightly miri test --locked --all-features
